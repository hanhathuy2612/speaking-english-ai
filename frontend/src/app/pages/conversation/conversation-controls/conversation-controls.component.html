<div
  class="controls"
  [class.controls--voice]="mode() === 'voice'"
  [class.controls--chat]="mode() === 'chat'"
>
  <button
    type="button"
    class="controls-switch"
    [disabled]="recording()"
    [title]="mode() === 'voice' ? 'Type a reply' : 'Speak instead'"
    [attr.aria-label]="mode() === 'voice' ? 'Switch to chat' : 'Switch to voice'"
    (click)="toggleMode()"
  >
    @if (mode() === 'voice') {
      <i class="bi bi-keyboard" aria-hidden="true"></i>
    } @else {
      <i class="bi bi-mic" aria-hidden="true"></i>
    }
  </button>

  <div id="controls-audio-panel" class="controls-audio">
    <div
      class="controls-meter"
      [class.controls-meter--recording]="recording()"
      [class.controls-meter--speaking]="aiSpeaking() && !recording()"
    >
      <div class="vu-fill" [style.width.%]="vuLevel()" aria-hidden="true"></div>
      <span
        class="controls-tip"
        [class.controls-tip--recording]="statusTip().kind === 'recording'"
        [class.controls-tip--transcribing]="statusTip().kind === 'transcribing'"
        [class.controls-tip--speaking]="statusTip().kind === 'speaking'"
        >{{ statusTip().text }}</span
      >
    </div>
    <button
      type="button"
      class="btn-record"
      [class.recording]="recording()"
      [class.speaking]="aiSpeaking()"
      (pointerdown)="onRecordPointerDown($event)"
      (pointerup)="onRecordPointerUp($event)"
      (pointercancel)="onRecordPointerUp($event)"
      [disabled]="!canRecord()"
      [attr.aria-label]="
        recording()
          ? 'Recording… release to send'
          : canRecord()
            ? 'Hold to speak'
            : 'Wait for AI to greet you first'
      "
    >
      <span class="btn-record__icon">
        @if (recording()) {
          <i class="bi bi-stop-fill" aria-hidden="true"></i>
        } @else {
          <i class="bi bi-mic-fill" aria-hidden="true"></i>
        }
      </span>
    </button>
    <span
      class="controls-tip controls-tip--desktop"
      [class.controls-tip--recording]="statusTip().kind === 'recording'"
      [class.controls-tip--transcribing]="statusTip().kind === 'transcribing'"
      [class.controls-tip--speaking]="statusTip().kind === 'speaking'"
      >{{ statusTip().text }}</span
    >
  </div>

  <div id="controls-chat-panel" class="controls-chat">
    <textarea
      #chatField
      class="chat-input"
      rows="1"
      [ngModel]="chatInput()"
      (ngModelChange)="chatInput.set($event)"
      (keydown.enter)="onChatEnterKey($event)"
      [placeholder]="messagesCount() === 0 ? 'Wait for AI to say hello…' : 'Type your reply…'"
      [disabled]="!connected() || messagesCount() === 0 || aiSpeaking()"
      title="Enter to send • Shift+Enter for a new line"
      aria-label="Message"
    ></textarea>
    <button
      type="button"
      class="chat-send"
      (click)="sendText.emit()"
      [disabled]="
        !connected() || messagesCount() === 0 || !chatInput().trim().length || aiSpeaking()
      "
      title="Send message"
      aria-label="Send message"
    >
      <i class="bi bi-send-fill" aria-hidden="true"></i>
    </button>
  </div>
</div>

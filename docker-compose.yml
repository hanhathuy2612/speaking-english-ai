# Deploy: MySQL + the app (GPU). LM Studio keeps running on the host. See docs/deployment.md.
#   docker compose up -d --build
# Settings come from .env at the project root (same file as the local setup), plus MYSQL_* below.

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    # utf8mb4_bin: the app compares strings in binary (a != á), see docs/dev-environment.md
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_bin
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-speaking}
      MYSQL_USER: ${MYSQL_USER:-speaking}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    volumes:
      - mysql:/var/lib/mysql
    # No published port: only the app reaches it (the host may already run MySQL on 3306).
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # These override .env, which is written for running on the host.
      # MYSQL_PASSWORD must be URL-safe here (no @ : / % #), or %xx-encoded.
      DATABASE_URL: mysql://${MYSQL_USER:-speaking}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE:-speaking}
      LM_URL: ${DOCKER_LM_URL:-http://host.docker.internal:1234/v1}
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8000"
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - ${APP_PORT:-8000}:8000
    volumes:
      - ./data:/app/data # jwt_secret: keeps logins valid across restarts
      - ./recordings:/app/recordings # SAVE_AUDIO_DIR=recordings
      - ./certs:/app/certs:ro # SSL_CERTFILE / SSL_KEYFILE (HTTPS for the microphone on the LAN)
      - whisper:/root/.cache/huggingface # Whisper model, downloaded once
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  mysql:
  whisper:

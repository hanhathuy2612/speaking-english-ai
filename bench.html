<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Đọc theo câu mẫu</title>
    <style>
      :root {
        --paper: #f2f4f6;
        --panel: #ffffff;
        --ink: #12202b;
        --muted: #5b6b78;
        --rule: #d5dbe0;
        --blue: #1d3fbb;
        --blue-ink: #ffffff;
        --ok: #1c8a57;
        --rec: #d9480f;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #0f161c;
          --panel: #151e26;
          --ink: #e6ecf1;
          --muted: #8d9ba7;
          --rule: #26323c;
          --blue: #7c9bff;
          --blue-ink: #0b1220;
          --ok: #4cc38a;
          --rec: #ff8a5b;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font:
          15px/1.5 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      .wrap {
        max-width: 760px;
        margin: 0 auto;
        padding: 24px 16px 40px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 4px;
      }
      .muted {
        color: var(--muted);
        margin: 0 0 20px;
      }
      #current {
        font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
        font-size: 26px;
        line-height: 1.4;
        padding: 20px;
        background: var(--panel);
        border: 1px solid var(--rule);
        border-radius: 10px;
        min-height: 110px;
      }
      .controls {
        display: flex;
        gap: 12px;
        align-items: center;
        margin: 16px 0 24px;
        flex-wrap: wrap;
      }
      #talk {
        border: 0;
        border-radius: 999px;
        padding: 14px 26px;
        background: var(--blue);
        color: var(--blue-ink);
        font: inherit;
        font-weight: 650;
        font-size: 16px;
        cursor: pointer;
        touch-action: none;
        user-select: none;
      }
      #talk.rec {
        background: var(--rec);
        color: #fff;
      }
      #status {
        color: var(--muted);
      }
      ol {
        padding-left: 24px;
        margin: 0;
      }
      li {
        padding: 6px 4px;
        border-top: 1px solid var(--rule);
        cursor: pointer;
        color: var(--muted);
      }
      li.done {
        color: var(--ink);
      }
      li.done::after {
        content: " ✓";
        color: var(--ok);
        font-weight: 700;
      }
      li.active {
        background: var(--panel);
        color: var(--ink);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Đọc theo câu mẫu</h1>
      <p class="muted">
        Đọc tự nhiên như khi nói chuyện, không cần chậm hay cố phát âm chuẩn. Giữ nút
        (hoặc giữ phím Space) để thu, thả ra để lưu và sang câu tiếp. Bấm vào câu bất
        kỳ để thu lại.
      </p>
      <div id="current"></div>
      <div class="controls">
        <button id="talk">Giữ để đọc</button>
        <span id="status"></span>
      </div>
      <ol id="list"></ol>
    </div>
    <script>
      const $ = (s) => document.querySelector(s);
      let items = [],
        idx = 0,
        rec = null,
        holding = false,
        stream = null;

      async function load() {
        items = await (await fetch("/api/bench")).json();
        const first = items.findIndex((x) => !x.done);
        idx = first < 0 ? 0 : first;
        render();
      }

      function render() {
        const ol = $("#list");
        ol.innerHTML = "";
        items.forEach((it, i) => {
          const li = document.createElement("li");
          li.textContent = it.text;
          li.className = (it.done ? "done " : "") + (i === idx ? "active" : "");
          li.onclick = () => {
            idx = i;
            render();
          };
          ol.appendChild(li);
        });
        const n = items.filter((x) => x.done).length;
        $("#current").textContent = items[idx]?.text || "";
        $("#status").textContent =
          n === items.length
            ? `Xong ${n}/${items.length} câu. Bạn có thể quay lại báo cho Claude.`
            : `Đã thu ${n}/${items.length} câu`;
      }

      async function start() {
        if (holding) return;
        holding = true;
        try {
          stream = stream || (await navigator.mediaDevices.getUserMedia({ audio: true }));
          if (!holding) return;
          const mime = MediaRecorder.isTypeSupported("audio/webm;codecs=opus")
            ? "audio/webm;codecs=opus"
            : "";
          const chunks = [];
          const r = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
          const i = idx;
          r.ondataavailable = (e) => chunks.push(e.data);
          r.onstop = async () => {
            const blob = new Blob(chunks, { type: r.mimeType });
            if (blob.size < 3000) {
              $("#status").textContent = "Thu quá ngắn, giữ nút lâu hơn.";
              return;
            }
            await fetch(`/api/bench/${i}`, { method: "POST", body: blob });
            items[i].done = true;
            const next = items.findIndex((x, k) => k > i && !x.done);
            idx = next >= 0 ? next : Math.min(i + 1, items.length - 1);
            render();
          };
          r.start();
          rec = r;
          $("#talk").classList.add("rec");
          $("#talk").textContent = "Đang thu. Thả ra để lưu";
        } catch (err) {
          holding = false;
          $("#status").textContent = "Không mở được micro: " + err.message;
        }
      }

      function stop() {
        holding = false;
        if (!rec) return;
        rec.stop();
        rec = null;
        $("#talk").classList.remove("rec");
        $("#talk").textContent = "Giữ để đọc";
      }

      const talk = $("#talk");
      talk.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        start();
      });
      ["pointerup", "pointerleave", "pointercancel"].forEach((ev) =>
        talk.addEventListener(ev, stop),
      );
      document.addEventListener("keydown", (e) => {
        if (e.code === "Space" && !e.repeat) {
          e.preventDefault();
          start();
        }
      });
      document.addEventListener("keyup", (e) => {
        if (e.code === "Space") stop();
      });
      load();
    </script>
  </body>
</html>
